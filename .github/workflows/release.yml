# Publishes the artifacts built by the "develop push" workflow:
#   * the Flatpak bundles, into self-hosted Flatpak (OSTree) repositories, and
#   * the Windows and macOS installers, into plain per-version directories.
#
# Everything lands in the same Cloudflare R2 bucket.  Each source branch gets its
# own area.  The Flatpak repositories are cumulative: previously published commits
# are retained so that a client which installed an older build can update in
# place, and pruning keeps the retained history (and therefore the download/upload
# size of each run) bounded.  The Windows/macOS directories are not repositories;
# every version is a separate immutable directory.
#
# Object layout in the bucket:
#   flatpak/<branch>/repo/                       OSTree repository (served to clients)
#   flatpak/<branch>/xarchat.flatpakrepo         remote definition users add
#   flatpak/<branch>/xarchat.flatpakref          one-click install descriptor
#   win-x64/<branch>/<version>/XarChat.exe
#   win-arm64/<branch>/<version>/XarChat.exe
#   macos-arm64/<branch>/<version>/XarChat-<version>.dmg
#   release-manifest.json                        index of the per-version builds above
#
# The version is the build timestamp stamped into the source run.  The Windows and
# macOS artifacts each carry it as a version.txt member, written alongside the
# installer by develop-push.yml; the version input overrides it and is only needed
# for runs built before version.txt existed.
#
# <branch> is the branch the source run was branded as, which is not always the
# branch the run was started from: develop-push.yml accepts a branch_override input
# so a run of, say, feature/foo can be branded (and therefore released) as develop.
# develop-push.yml records that value in a small build-info artifact (branch.txt +
# version.txt) which this workflow reads to pick the destination; runs that predate
# that artifact fall back to the run's head branch.
#
# release-manifest.json at the bucket root indexes the per-version directories so a
# client can discover what is available without listing the bucket: one entry per
# platform and branch, holding that target's newest versions with their sizes.  Each
# publish job reports the version and size it uploaded, and a final job folds those
# into the manifest already in the bucket, so the file is the sole record of what was
# published previously -- nothing is rediscovered by listing the bucket.  A version
# therefore stays listed even when its object is gone, and losing the file loses the
# history.  Flatpak is not listed because those repositories are cumulative rather
# than per-version directories.  Retention is the newest ten versions of each target
# by version number, not by publish time.
#
# Required repository configuration:
#   vars.R2_ENDPOINT              https://<account-id>.r2.cloudflarestorage.com
#   vars.R2_BUCKET                bucket name
#   vars.FLATPAK_BASE_URL         public base URL for the bucket, no trailing slash
#   secrets.R2_ACCESS_KEY_ID      R2 API token access key id
#   secrets.R2_SECRET_ACCESS_KEY  R2 API token secret access key
#
# R2 rejects requests with the wrong signing region or a malformed secret, so the
# resolve job verifies the configuration with a signed request before any publish
# job runs and explains what to fix (wrong secret, stray whitespace, wrong endpoint,
# missing bucket permission) instead of letting every job fail on its own upload.
# That step passes the same two secrets as AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY;
# without them the CLI sends nothing to R2 and exits 253 (CONFIGURATION_ERROR_RC).
#
# Optional, enables signed repository metadata:
#   secrets.FLATPAK_GPG_KEY_ID        fingerprint (or long key id) of the signing key
#   secrets.FLATPAK_GPG_PRIVATE_KEY   the private key itself, either ASCII-armored
#                                     (gpg --armor --export-secret-keys <FPR>) or
#                                     base64 of it (| base64 -w0). Signing happens
#                                     unattended, so the key must have no passphrase.

name: "release"

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        type: string
        description: "develop push run ID to publish from (blank = latest successful run of source_branch)"
        required: false
      source_branch:
        type: choice
        description: "Head branch to publish when source_run_id is blank (runs branded via branch_override must be selected by source_run_id)"
        options:
          - "develop"
          - "master"
        default: "master"
      version:
        type: string
        description: "Override the build version (blank = use the version.txt inside each artifact)"
        required: false
      dry_run:
        type: boolean
        description: "Do everything except upload to R2"
        default: false

permissions:
  actions: read
  contents: read

env:
  APP_ID: net.xariah.xarchat
  PRUNE_DEPTH: "5"
  # R2 rejects the flexible-checksum headers and the region AWS SDKs pick by default;
  # signing with anything other than "auto" fails with SignatureDoesNotMatch.
  AWS_REGION: auto
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  resolve:
    runs-on: ubuntu-24.04

    outputs:
      run_id: ${{ steps.source.outputs.run_id }}
      branch: ${{ steps.branch.outputs.branch }}
      has_win_x64: ${{ steps.artifacts.outputs.has_win_x64 }}
      has_win_arm64: ${{ steps.artifacts.outputs.has_win_arm64 }}
      has_macos_dmg: ${{ steps.artifacts.outputs.has_macos_dmg }}

    steps:
    - id: source
      name: "Resolve Source Run"
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        INPUT_RUN_ID: ${{ inputs.source_run_id }}
        INPUT_BRANCH: ${{ inputs.source_branch }}
      run: |
        set -euo pipefail
        if [ -n "${INPUT_RUN_ID}" ]; then
          RUN_ID="${INPUT_RUN_ID}"
        else
          RUN_ID=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow develop-push.yml \
            --branch "${INPUT_BRANCH}" --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId')
        fi
        if [ -z "${RUN_ID}" ] || [ "${RUN_ID}" = "null" ]; then
          echo "::error::Unable to determine the source workflow run"
          exit 1
        fi
        BRANCH=$(gh run view "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json headBranch --jq '.headBranch')
        if [ -z "${BRANCH}" ] || [ "${BRANCH}" = "null" ]; then
          echo "::error::Unable to determine the source branch of run ${RUN_ID}"
          exit 1
        fi
        echo "Publishing run ${RUN_ID} (head branch ${BRANCH})"
        echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
        echo "head_branch=${BRANCH}" >> "$GITHUB_OUTPUT"

    - id: artifacts
      name: "Inspect Source Artifacts"
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RUN_ID: ${{ steps.source.outputs.run_id }}
      run: |
        set -euo pipefail
        NAMES=$(gh api --paginate \
          "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
          --jq '.artifacts[].name')
        echo "${NAMES}" | sort
        has() {
          if grep -qxF "$2" <<< "${NAMES}"; then
            echo "$1=true" >> "$GITHUB_OUTPUT"
          else
            echo "$1=false" >> "$GITHUB_OUTPUT"
          fi
        }
        has has_win_x64 win32-exe-x64
        has has_win_arm64 win32-exe-arm64
        has has_macos_dmg macos-dmg
        has has_build_info build-info

    - id: build_info
      name: "Download Build Info"
      if: ${{ steps.artifacts.outputs.has_build_info == 'true' }}
      uses: actions/download-artifact@v4
      with:
        name: build-info
        path: build-info
        run-id: ${{ steps.source.outputs.run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - id: branch
      name: "Resolve Release Branch"
      shell: bash
      env:
        HEAD_BRANCH: ${{ steps.source.outputs.head_branch }}
        HAS_BUILD_INFO: ${{ steps.artifacts.outputs.has_build_info }}
      run: |
        set -euo pipefail
        BRANCH=${HEAD_BRANCH//\//-}
        BRANCH_FILE=""
        if [ "${HAS_BUILD_INFO}" = "true" ]; then
          BRANCH_FILE=$(find build-info -type f -name branch.txt -print -quit 2>/dev/null || true)
        fi
        if [ -n "${BRANCH_FILE}" ]; then
          BRANCH=$(tr -d '[:space:]' < "${BRANCH_FILE}")
          echo "Using the branch recorded by the source run's build-info artifact: ${BRANCH}"
          if [ "${BRANCH}" != "${HEAD_BRANCH}" ]; then
            echo "The source run was started from ${HEAD_BRANCH} but is branded as ${BRANCH}"
          fi
        else
          echo "The source run has no build-info artifact; falling back to its head branch: ${BRANCH}"
        fi
        case "${BRANCH}" in
          ""|null)
            echo "::error::Unable to determine the branch to publish"
            exit 1
            ;;
          *[!0-9A-Za-z._-]*)
            echo "::error::Branch '${BRANCH}' contains characters that are not safe for a release path"
            exit 1
            ;;
        esac
        echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

    - id: preflight
      name: "Verify R2 Configuration"
      if: ${{ inputs.dry_run != true }}
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        R2_BUCKET: ${{ vars.R2_BUCKET }}
      run: |
        # `shell: bash` hands this script -e, which would abort it on the first
        # failing probe before the failure could be explained. It is turned off
        # deliberately; every command below inspects its own exit status instead.
        set +e
        set -uo pipefail
        if [ -z "${R2_ENDPOINT}" ] || [ -z "${R2_BUCKET}" ]; then
          echo "::warning::vars.R2_ENDPOINT / vars.R2_BUCKET are not set; the publish jobs will not be able to upload"
          exit 0
        fi

        FAIL=0
        echo "aws CLI: $(aws --version 2>&1)"
        echo "endpoint: ${R2_ENDPOINT}"
        echo "bucket: ${R2_BUCKET}"
        echo "signing region: AWS_REGION=${AWS_REGION:-unset} AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-unset}"
        echo "checksum calculation: ${AWS_REQUEST_CHECKSUM_CALCULATION:-unset}"
        echo "credentials visible to the CLI: AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:+set} AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:+set}"

        # A rejected signature nearly always means a value differs from the one the
        # dashboard issued, so report the shape of each value (never its bytes) to
        # make a truncated, swapped, or invisible-character paste visible. The
        # fingerprint is of the secret, but 12 hex digits of a sha256 of a
        # high-entropy value reveals nothing and allows a local comparison.
        AK="${R2_ACCESS_KEY:-}"
        SK="${R2_SECRET:-}"
        ishex() {
          case "$1" in ''|*[!0-9A-Fa-f]*) return 1 ;; esac
          return 0
        }
        iscfToken() {
          case "$1" in cf[a-z][a-z]_*) return 0 ;; esac
          return 1
        }
        shape() {
          local value="$1" charset="pure hex"
          ishex "${value}" || charset="not pure hex"
          printf '%s chars, %s, sha256 %s' "${#value}" "${charset}" \
            "$(printf '%s' "${value}" | sha256sum | cut -c1-12)"
        }
        echo "access key id: $(shape "${AK}")"
        echo "secret: $(shape "${SK}")"

        # R2's S3 secret is the SHA-256 hex digest of the API token value, while
        # the access key id is the token's id. Pasting the token value itself
        # (cfut_ for user tokens, cfat_ for account tokens) into the secret is
        # therefore both a common mistake and a detectable one.
        if iscfToken "${SK}"; then
          echo "::error::R2_SECRET_ACCESS_KEY holds a Cloudflare API token value, not the R2 secret access key. R2's S3 secret is the SHA-256 hex digest of that token value: derive it with \"printf %s '<token value>' | sha256sum\", or copy the Secret Access Key shown next to the Access Key ID on the R2 API token page."
          FAIL=1
        elif [ "${#SK}" -ne 0 ] && { [ "${#SK}" -ne 64 ] || ! ishex "${SK}"; }; then
          echo "::warning::the secret is not a 64-character hex value, which is what R2 issues as a secret access key; it looks like the wrong field, a truncated paste, or the token value instead of its SHA-256 digest."
        fi
        if [ "${#AK}" -ne 0 ] && { [ "${#AK}" -ne 32 ] || ! ishex "${AK}"; }; then
          echo "::warning::the access key id is not a 32-character hex value, which is what R2 issues as an access key id; it is the id of the API token, not the token value."
        fi
        if [ "${#AK}" -ne 0 ] && [ "${#AK}" -eq "${#SK}" ]; then
          echo "::warning::the access key id and the secret are the same length (${#AK}); the same value was probably pasted into both"
        fi

        if [ -z "${R2_ACCESS_KEY:-}" ] || [ -z "${R2_SECRET:-}" ]; then
          echo "::error::secrets.R2_ACCESS_KEY_ID and secrets.R2_SECRET_ACCESS_KEY must both be set to an R2 API token's Access Key ID and Secret Access Key"
          FAIL=1
        fi

        # A trailing newline pasted in with the secret is silently part of the value, and
        # an R2 secret key never contains whitespace, so this cannot be a false positive.
        for NAME in R2_ACCESS_KEY R2_SECRET; do
          VALUE="${!NAME:-}"
          if [ "${VALUE}" != "$(printf '%s' "${VALUE}" | tr -d '[:space:]')" ]; then
            echo "::error::The ${NAME} value contains whitespace, most likely a trailing newline from pasting. Re-create the secret with exactly the value Cloudflare shows."
            FAIL=1
          fi
        done

        case "${R2_ENDPOINT}" in
          https://*) ;;
          *) echo "::error::vars.R2_ENDPOINT must start with https:// (got '${R2_ENDPOINT}')"; FAIL=1 ;;
        esac
        ENDPOINT_HOST="${R2_ENDPOINT#https://}"
        case "${ENDPOINT_HOST}" in
          */*)
            echo "::error::vars.R2_ENDPOINT must be the bare account endpoint, with no path, bucket name, or trailing slash (got '${R2_ENDPOINT}')"
            FAIL=1
            ;;
        esac
        if [ "${FAIL}" -eq 0 ]; then
          case "${R2_ENDPOINT}" in
            https://*.r2.cloudflarestorage.com) ;;
            *) echo "::warning::vars.R2_ENDPOINT does not look like https://<account-id>.r2.cloudflarestorage.com" ;;
          esac
        fi
        if [ "${FAIL}" -ne 0 ]; then
          exit 1
        fi

        fault() {
          local context="$1" text="$2" rc="$3" code
          code=$(printf '%s' "${text}" | grep -oE 'SignatureDoesNotMatch|InvalidAccessKeyId|AccessDenied|NoSuchBucket|InvalidBucketName|RequestTimeTooSkewed|NotImplemented' | head -n 1)
          echo "::error::${context} (aws exit ${rc}${code:+, ${code}})"
          if [ -n "${text}" ]; then
            printf '%s\n' "${text}"
          else
            echo "The CLI produced no output at all."
          fi
          case "${code}" in
            SignatureDoesNotMatch)
              echo "R2 found the access key id but the signature did not match, so it is the secret that is wrong."
              echo "R2's secret access key is the SHA-256 hex digest of the API token value, not the token value itself, and is always 64 hex characters."
              echo "If the shapes above are 32 and 64 hex characters then both values are well-formed and R2 is rejecting the pair, so re-copy both from the same token or create a new token and update both secrets."
              ;;
            InvalidAccessKeyId)
              echo "secrets.R2_ACCESS_KEY_ID is not a valid R2 Access Key ID."
              echo "Use the token's Access Key ID, not the token value or the Cloudflare account id."
              ;;
            AccessDenied)
              echo "The credentials are valid but the token is not allowed to do this."
              echo "The token needs Object Read & Write permission on the '${R2_BUCKET}' bucket (all-buckets scope also works)."
              ;;
            NoSuchBucket)
              echo "vars.R2_BUCKET names a bucket that does not exist. Check the spelling and that the token can see it."
              ;;
            RequestTimeTooSkewed)
              echo "The runner clock is too far from Cloudflare's. Re-run the workflow."
              ;;
            NotImplemented)
              echo "R2 rejected part of the request. Make sure the AWS CLI is not sending flexible-checksum headers; this workflow sets AWS_REQUEST_CHECKSUM_CALCULATION=when_required for that reason."
              ;;
            *)
              # No R2 error code in the output means R2 never answered, so fall back
              # to the CLI's own exit status, which awscli/constants.py fixes as:
              # 252 parameter validation, 253 configuration, 254 client, 255 general.
              case "${rc}" in
                252) echo "The AWS CLI rejected the command line before sending it. That is a bug in this workflow, not in your configuration." ;;
                253) echo "The AWS CLI found no usable credentials, so nothing was sent to R2. AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY must both reach this step; if they are set, the value itself is malformed (a trailing newline from pasting is the usual cause)." ;;
                254) echo "R2 rejected the request; the message above is its response." ;;
                255) echo "The AWS CLI failed before reaching R2 (DNS, TLS, or proxy)." ;;
                *) echo "Compare vars.R2_ENDPOINT and vars.R2_BUCKET with the R2 dashboard; the account endpoint is https://<account-id>.r2.cloudflarestorage.com" ;;
              esac
              ;;
          esac
        }

        echo "Verifying read access to s3://${R2_BUCKET} ..."
        ERR=$(aws s3api list-objects-v2 --bucket "${R2_BUCKET}" --max-keys 1 \
          --endpoint-url "${R2_ENDPOINT}" 2>&1 >/dev/null)
        RC=$?
        if [ "${RC}" -ne 0 ]; then
          fault "Unable to list s3://${R2_BUCKET} at ${R2_ENDPOINT}" "${ERR}" "${RC}"
          exit 1
        fi
        echo "Read access verified"

        # The publish steps upload the .exe, .dmg and flatpak objects with a multipart
        # upload once they are over 8 MB, which a listing check never exercises, so
        # start and immediately abort a real multipart upload instead.
        PROBE_KEY=".xarchat-preflight-probe"
        MPU=$(aws s3api create-multipart-upload --bucket "${R2_BUCKET}" --key "${PROBE_KEY}" \
          --endpoint-url "${R2_ENDPOINT}" 2>&1)
        RC=$?
        if [ "${RC}" -ne 0 ]; then
          fault "Unable to start a multipart upload in s3://${R2_BUCKET}" "${MPU}" "${RC}"
          exit 1
        fi
        UPLOAD_ID=$(printf '%s' "${MPU}" | grep -o '"UploadId": *"[^"]*"' | head -n 1 | cut -d '"' -f 4)
        if [ -n "${UPLOAD_ID}" ]; then
          aws s3api abort-multipart-upload --bucket "${R2_BUCKET}" --key "${PROBE_KEY}" \
            --upload-id "${UPLOAD_ID}" --endpoint-url "${R2_ENDPOINT}" >/dev/null 2>&1 \
            || echo "::warning::Unable to abort the multipart upload probe ${UPLOAD_ID}; it holds no data and can be aborted from the bucket's settings"
        fi
        echo "Write access and multipart uploads verified"
        exit 0

  publish-flatpak-repo:
    needs: resolve
    runs-on: ubuntu-24.04

    steps:
    - id: download
      name: "Download Flatpak Bundles"
      uses: actions/download-artifact@v4
      with:
        pattern: linux-flatpak-*
        path: bundles
        merge-multiple: true
        run-id: ${{ needs.resolve.outputs.run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - id: tools
      name: "Install Flatpak Tooling"
      shell: bash
      run: |
        set -euo pipefail
        MISSING=()
        command -v flatpak >/dev/null 2>&1 || MISSING+=(flatpak)
        command -v ostree  >/dev/null 2>&1 || MISSING+=(ostree)
        command -v aws     >/dev/null 2>&1 || MISSING+=(awscli)
        if [ ${#MISSING[@]} -gt 0 ]; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${MISSING[@]}"
        fi
        flatpak --version
        ostree --version
        ls -l bundles

    - id: gpg
      name: "Import Signing Key"
      shell: bash
      env:
        GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
      run: |
        set -euo pipefail
        if [ -z "${GPG_KEY_ID}" ]; then
          echo "No signing key configured; repository metadata will not be signed"
          exit 0
        fi
        if [ -z "${GPG_PRIVATE_KEY}" ]; then
          echo "::error::FLATPAK_GPG_KEY_ID is set but FLATPAK_GPG_PRIVATE_KEY is not"
          exit 1
        fi
        # The secret holds either the armored key or its base64 encoding, and both
        # are stripped of line breaks before use: a blob produced with
        # "gpg --export-secret-keys | base64 | tr -d '\n'" on Windows keeps the CR
        # of every CRLF pair, and base64 --decode rejects CR as "invalid input"
        # before gpg ever sees a key.
        case "${GPG_PRIVATE_KEY}" in
          "-----BEGIN PGP PRIVATE KEY BLOCK-----"*)
            KEY="${GPG_PRIVATE_KEY}"
            ;;
          *)
            if ! KEY=$(printf '%s' "${GPG_PRIVATE_KEY}" | tr -d '\r\n \t' | base64 --decode 2>/dev/null); then
              echo "::error::FLATPAK_GPG_PRIVATE_KEY is neither an ASCII-armored key nor valid base64. Re-store it with: gpg --armor --export-secret-keys <FPR> | base64 -w0"
              exit 1
            fi
            ;;
        esac
        if ! printf '%s' "${KEY}" | gpg --batch --import; then
          echo "::error::FLATPAK_GPG_PRIVATE_KEY does not contain an importable private key. Store the ASCII-armored export (gpg --armor --export-secret-keys <FPR>), which survives being held as text; a binary export does not."
          exit 1
        fi
        if ! gpg --list-secret-keys --with-colons "${GPG_KEY_ID}" 2>/dev/null | grep -q '^sec'; then
          echo "::error::no secret key matching FLATPAK_GPG_KEY_ID (${GPG_KEY_ID}) was imported; keys present after import:"
          gpg --list-secret-keys --with-colons 2>/dev/null | awk -F: '/^fpr/ { print "  " $10 }'
          exit 1
        fi
        FPR=$(gpg --list-secret-keys --with-colons "${GPG_KEY_ID}" 2>/dev/null | awk -F: '/^fpr/ { print $10; exit }')
        echo "Imported signing key ${FPR}"

        # Signing runs unattended further down the job, where a passphrase-protected
        # key fails only after the bundles have been rebuilt, so prove that the key
        # can sign right now.
        PROBE=$(mktemp -d)
        if ! printf 'probe' | gpg --batch --yes --detach-sign --local-user "${FPR}" -o "${PROBE}/probe.sig" 2>"${PROBE}/err"; then
          echo "::error::the signing key ${FPR} cannot sign without a passphrase here:"
          sed 's/^/  /' "${PROBE}/err"
          echo "Use a dedicated repository-signing key with no passphrase."
          rm -rf "${PROBE}"
          exit 1
        fi
        rm -rf "${PROBE}"

    - id: restore_repo
      name: "Restore Published Repository"
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: auto
        R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        R2_BUCKET: ${{ vars.R2_BUCKET }}
        PREFIX: flatpak/${{ needs.resolve.outputs.branch }}
      run: |
        set -euo pipefail
        mkdir -p repo
        if [ -z "${R2_BUCKET}" ] || [ -z "${R2_ENDPOINT}" ]; then
          echo "::warning::R2 is not configured; starting from an empty repository"
          exit 0
        fi
        aws s3 sync "s3://${R2_BUCKET}/${PREFIX}/repo" repo \
          --endpoint-url "${R2_ENDPOINT}" --only-show-errors
        echo "Restored $(find repo -type f | wc -l) repository files"

    - id: init_repo
      name: "Initialize Repository"
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -f repo/config ]; then
          echo "Creating a new OSTree repository"
          ostree init --repo=repo --mode=archive
        else
          # A round trip through R2 carries files but not directories, so every empty
          # directory ostree init creates is missing from a restored repository. The
          # prune-and-summary pass inside flatpak build-update-repo lists refs through
          # ostree_repo_list_refs(), which opens refs/remotes without tolerating its
          # absence, so a restored repository fails with "Listing refs:
          # opendir(refs/remotes): No such file or directory" while a freshly created
          # one works. Recreate the directory layout ostree init produces.
          for DIR in extensions objects refs/heads refs/mirrors refs/remotes state tmp/cache; do
            mkdir -p "repo/${DIR}"
          done
          echo "Restored repository structure repaired"
        fi

    - id: import_bundles
      name: "Import Flatpak Bundles"
      shell: bash
      env:
        BRANCH: ${{ needs.resolve.outputs.branch }}
        GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        BUNDLES=(bundles/*.flatpak)
        if [ ${#BUNDLES[@]} -eq 0 ]; then
          echo "::error::No .flatpak bundles were found in the downloaded artifacts"
          exit 1
        fi
        SIGN_ARGS=()
        if [ -n "${GPG_KEY_ID}" ]; then
          SIGN_ARGS+=(--gpg-sign="${GPG_KEY_ID}")
        fi
        for BUNDLE in "${BUNDLES[@]}"; do
          case "${BUNDLE}" in
            *_x64.flatpak)   ARCH=x86_64 ;;
            *_arm64.flatpak) ARCH=aarch64 ;;
            *)
              echo "::error::Cannot determine the architecture of ${BUNDLE}"
              exit 1
              ;;
          esac
          REF="app/${APP_ID}/${ARCH}/${BRANCH}"
          echo "Importing ${BUNDLE} as ${REF}"
          flatpak build-import-bundle \
            --no-update-summary \
            --ref="${REF}" \
            "${SIGN_ARGS[@]}" \
            repo "${BUNDLE}"
        done

    - id: update_repo
      name: "Update Repository Metadata"
      shell: bash
      env:
        BRANCH: ${{ needs.resolve.outputs.branch }}
        GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
      run: |
        set -euo pipefail
        SIGN_ARGS=()
        if [ -n "${GPG_KEY_ID}" ]; then
          SIGN_ARGS+=(--gpg-sign="${GPG_KEY_ID}")
        fi
        flatpak build-update-repo \
          --generate-static-deltas \
          --prune \
          --prune-depth="${PRUNE_DEPTH}" \
          --title="XarChat (${BRANCH})" \
          --comment="XarChat builds from the ${BRANCH} branch" \
          --homepage="https://github.com/${GITHUB_REPOSITORY}" \
          --default-branch="${BRANCH}" \
          "${SIGN_ARGS[@]}" \
          repo
        echo "Repository refs:"
        ostree --repo=repo refs
        du -sh repo

    - id: descriptors
      name: "Create Repository Descriptors"
      shell: bash
      env:
        BRANCH: ${{ needs.resolve.outputs.branch }}
        PREFIX: flatpak/${{ needs.resolve.outputs.branch }}
        BASE_URL: ${{ vars.FLATPAK_BASE_URL }}
        GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
      run: |
        set -euo pipefail
        mkdir -p publish
        BASE="${BASE_URL%/}"
        if [ -z "${BASE}" ]; then
          BASE="https://flatpak.invalid"
          echo "::warning::FLATPAK_BASE_URL is not configured; using a placeholder URL"
        fi
        REPO_URL="${BASE}/${PREFIX}/repo"
        FLATHUB="https://dl.flathub.org/repo/flathub.flatpakrepo"

        {
          echo "[Flatpak Repo]"
          echo "Title=XarChat (${BRANCH})"
          echo "Url=${REPO_URL}"
          echo "Homepage=https://github.com/${GITHUB_REPOSITORY}"
          echo "Comment=XarChat builds from the ${BRANCH} branch"
          if [ -n "${GPG_KEY_ID}" ]; then
            echo "GPGKey=$(gpg --batch --armor --export "${GPG_KEY_ID}" | sed ':a;N;$!ba;s/\n/\\n/g')"
          fi
        } > publish/xarchat.flatpakrepo

        {
          echo "[Flatpak Ref]"
          echo "Title=XarChat (${BRANCH})"
          echo "Name=${APP_ID}"
          echo "Branch=${BRANCH}"
          echo "Url=${REPO_URL}"
          echo "RuntimeRepo=${FLATHUB}"
          echo "IsRuntime=false"
          if [ -n "${GPG_KEY_ID}" ]; then
            echo "GPGKey=$(gpg --batch --armor --export "${GPG_KEY_ID}" | sed ':a;N;$!ba;s/\n/\\n/g')"
          fi
        } > publish/xarchat.flatpakref

        cat publish/xarchat.flatpakrepo

    - id: upload
      name: "Upload Repository to R2"
      if: ${{ !inputs.dry_run }}
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: auto
        R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        R2_BUCKET: ${{ vars.R2_BUCKET }}
        PREFIX: flatpak/${{ needs.resolve.outputs.branch }}
      run: |
        set -euo pipefail
        if [ -z "${R2_BUCKET}" ] || [ -z "${R2_ENDPOINT}" ]; then
          echo "::error::R2_BUCKET and R2_ENDPOINT must be configured to publish"
          exit 1
        fi
        TARGET="s3://${R2_BUCKET}/${PREFIX}"
        ENDPOINT=(--endpoint-url "${R2_ENDPOINT}" --only-show-errors)

        # Content-addressed objects and deltas never change, so they are safe to
        # cache forever.  The --delete passes also drop objects removed by pruning.
        for DIR in objects deltas; do
          if [ -d "repo/${DIR}" ]; then
            aws s3 sync "repo/${DIR}" "${TARGET}/repo/${DIR}" \
              --delete "${ENDPOINT[@]}" \
              --cache-control "public, max-age=31536000, immutable"
          fi
        done

        # Everything else (config, refs, summary, state) must be revalidated on
        # every update check.
        aws s3 sync repo "${TARGET}/repo" \
          --delete "${ENDPOINT[@]}" \
          --exclude "objects/*" --exclude "deltas/*" --exclude ".lock" \
          --cache-control "no-cache"

        aws s3 cp publish/xarchat.flatpakrepo "${TARGET}/xarchat.flatpakrepo" \
          "${ENDPOINT[@]}" --cache-control "no-cache" --content-type "text/plain"
        aws s3 cp publish/xarchat.flatpakref "${TARGET}/xarchat.flatpakref" \
          "${ENDPOINT[@]}" --cache-control "no-cache" --content-type "text/plain"

    - id: summary
      name: "Publish Summary"
      shell: bash
      env:
        BRANCH: ${{ needs.resolve.outputs.branch }}
        PREFIX: flatpak/${{ needs.resolve.outputs.branch }}
        BASE_URL: ${{ vars.FLATPAK_BASE_URL }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        set -euo pipefail
        BASE="${BASE_URL%/}"
        {
          echo "## Flatpak repository: ${BRANCH}"
          echo ""
          echo "- Source run: ${{ needs.resolve.outputs.run_id }}"
          echo "- Refs:"
          while read -r REF; do echo "  - \`${REF}\`"; done < <(ostree --repo=repo refs)
          echo ""
          if [ "${DRY_RUN}" = "true" ]; then
            echo "> Dry run: nothing was uploaded to R2."
          else
            echo "Remote: \`${BASE}/${PREFIX}/repo\`"
            echo ""
            echo "Users install/update with:"
            echo ""
            echo '```sh'
            echo "flatpak remote-add --user xarchat-${BRANCH} ${BASE}/${PREFIX}/xarchat.flatpakrepo"
            echo "flatpak install --user xarchat-${BRANCH} ${APP_ID}//${BRANCH}"
            echo "flatpak update --user ${APP_ID}"
            echo '```'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - id: dump_logs
      name: "Dump Diagnostics"
      if: failure()
      shell: bash
      run: |
        echo "=== repo tree ==="
        find repo -maxdepth 2 2>/dev/null | head -n 60 || true
        echo "=== repo refs ==="
        ostree --repo=repo refs 2>/dev/null || true
        echo "=== bundles ==="
        ls -lR bundles 2>/dev/null || true

  publish-windows:
    needs: resolve
    if: ${{ needs.resolve.outputs.has_win_x64 == 'true' || needs.resolve.outputs.has_win_arm64 == 'true' }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            artifact: win32-exe-x64
            available: ${{ needs.resolve.outputs.has_win_x64 }}
          - arch: arm64
            artifact: win32-exe-arm64
            available: ${{ needs.resolve.outputs.has_win_arm64 }}

    steps:
    - id: download
      name: "Download Windows Build (${{ matrix.arch }})"
      if: matrix.available == 'true'
      uses: actions/download-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: dist
        run-id: ${{ needs.resolve.outputs.run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - id: version
      name: "Resolve Version (${{ matrix.arch }})"
      if: matrix.available == 'true'
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ARTIFACT: ${{ matrix.artifact }}
      run: |
        set -euo pipefail
        ls -lR dist
        VERSION=""
        VERSION_FILE=$(find dist -type f -name version.txt -print -quit)
        if [ -n "${VERSION_FILE}" ]; then
          VERSION=$(head -n 1 "${VERSION_FILE}" | tr -d '[:space:]')
        fi
        if [ -z "${VERSION}" ]; then
          VERSION="${INPUT_VERSION}"
        fi
        if [ -z "${VERSION}" ]; then
          echo "::error::The ${ARTIFACT} artifact has no version.txt; pass the version input for older runs"
          exit 1
        fi
        # The version becomes an R2 object key, so keep it to characters that are
        # safe in a path segment.
        case "${VERSION}" in
          *[!0-9A-Za-z._-]*)
            echo "::error::Version '${VERSION}' contains characters that are not safe for an object key"
            exit 1
            ;;
        esac
        echo "Version: ${VERSION}"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    - id: upload
      name: "Publish Windows Build to R2 (${{ matrix.arch }})"
      if: matrix.available == 'true'
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: auto
        R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        R2_BUCKET: ${{ vars.R2_BUCKET }}
        BRANCH: ${{ needs.resolve.outputs.branch }}
        VERSION: ${{ steps.version.outputs.version }}
        ARCH: ${{ matrix.arch }}
        ARTIFACT: ${{ matrix.artifact }}
        SOURCE_RUN: ${{ needs.resolve.outputs.run_id }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        set -euo pipefail
        EXE=$(find dist -type f -name '*.exe' -print -quit)
        if [ -z "${EXE}" ]; then
          echo "::error::No .exe was found in the ${ARTIFACT} artifact"
          exit 1
        fi
        DEST="s3://${R2_BUCKET}/win-${ARCH}/${BRANCH}/${VERSION}/XarChat.exe"
        if [ "${DRY_RUN}" = "true" ]; then
          echo "Dry run: would upload ${EXE} to ${DEST}"
        else
          if [ -z "${R2_BUCKET}" ] || [ -z "${R2_ENDPOINT}" ]; then
            echo "::error::R2_BUCKET and R2_ENDPOINT must be configured to publish"
            exit 1
          fi
          if ! command -v aws >/dev/null 2>&1; then
            echo "::error::The aws CLI is required to publish to R2 but is not on this runner"
            exit 1
          fi
          echo "Uploading ${EXE} to ${DEST}"
          aws s3 cp "${EXE}" "${DEST}" \
            --endpoint-url "${R2_ENDPOINT}" --only-show-errors \
            --content-type "application/octet-stream" \
            --cache-control "public, max-age=31536000, immutable"
          # What the release manifest records, as platform|branch|version|size.
          printf '%s|%s|%s|%s\n' "win-${ARCH}" "${BRANCH}" "${VERSION}" \
            "$(stat -c %s "${EXE}")" > "${RUNNER_TEMP}/release-entry.txt"
        fi
        {
          echo "## Windows build: ${ARCH} ${VERSION}"
          echo ""
          echo "- Source run: ${SOURCE_RUN}"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "> Dry run: nothing was uploaded to R2."
            echo "- Would publish: \`${DEST}\`"
          else
            echo "- Published: \`${DEST}\`"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - id: report
      name: "Hand Over Release Entry (${{ matrix.arch }})"
      if: matrix.available == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: release-entry-win-${{ matrix.arch }}
        path: ${{ runner.temp }}/release-entry.txt
        # A dry run writes no entry, so there is nothing to hand over.
        if-no-files-found: ignore
        retention-days: 1

  publish-macos:
    needs: resolve
    if: ${{ needs.resolve.outputs.has_macos_dmg == 'true' }}
    runs-on: ubuntu-24.04

    steps:
    - id: download
      name: "Download macOS Disk Image"
      uses: actions/download-artifact@v4
      with:
        name: macos-dmg
        path: dist
        run-id: ${{ needs.resolve.outputs.run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - id: version
      name: "Resolve Version"
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ARTIFACT: macos-dmg
      run: |
        set -euo pipefail
        ls -lR dist
        VERSION=""
        VERSION_FILE=$(find dist -type f -name version.txt -print -quit)
        if [ -n "${VERSION_FILE}" ]; then
          VERSION=$(head -n 1 "${VERSION_FILE}" | tr -d '[:space:]')
        fi
        if [ -z "${VERSION}" ]; then
          VERSION="${INPUT_VERSION}"
        fi
        if [ -z "${VERSION}" ]; then
          echo "::error::The ${ARTIFACT} artifact has no version.txt; pass the version input for older runs"
          exit 1
        fi
        # The version becomes an R2 object key, so keep it to characters that are
        # safe in a path segment.
        case "${VERSION}" in
          *[!0-9A-Za-z._-]*)
            echo "::error::Version '${VERSION}' contains characters that are not safe for an object key"
            exit 1
            ;;
        esac
        echo "Version: ${VERSION}"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    - id: upload
      name: "Publish macOS Disk Image to R2"
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: auto
        R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        R2_BUCKET: ${{ vars.R2_BUCKET }}
        BRANCH: ${{ needs.resolve.outputs.branch }}
        VERSION: ${{ steps.version.outputs.version }}
        SOURCE_RUN: ${{ needs.resolve.outputs.run_id }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        set -euo pipefail
        DMG=$(find dist -type f -name '*.dmg' -print -quit)
        if [ -z "${DMG}" ]; then
          echo "::error::No .dmg was found in the macos-dmg artifact"
          exit 1
        fi
        DEST="s3://${R2_BUCKET}/macos-arm64/${BRANCH}/${VERSION}/$(basename "${DMG}")"
        if [ "${DRY_RUN}" = "true" ]; then
          echo "Dry run: would upload ${DMG} to ${DEST}"
        else
          if [ -z "${R2_BUCKET}" ] || [ -z "${R2_ENDPOINT}" ]; then
            echo "::error::R2_BUCKET and R2_ENDPOINT must be configured to publish"
            exit 1
          fi
          if ! command -v aws >/dev/null 2>&1; then
            echo "::error::The aws CLI is required to publish to R2 but is not on this runner"
            exit 1
          fi
          echo "Uploading ${DMG} to ${DEST}"
          aws s3 cp "${DMG}" "${DEST}" \
            --endpoint-url "${R2_ENDPOINT}" --only-show-errors \
            --content-type "application/x-apple-diskimage" \
            --cache-control "public, max-age=31536000, immutable"
          # What the release manifest records, as platform|branch|version|size.
          printf '%s|%s|%s|%s\n' "macos-arm64" "${BRANCH}" "${VERSION}" \
            "$(stat -c %s "${DMG}")" > "${RUNNER_TEMP}/release-entry.txt"
        fi
        {
          echo "## macOS build: arm64 ${VERSION}"
          echo ""
          echo "- Source run: ${SOURCE_RUN}"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "> Dry run: nothing was uploaded to R2."
            echo "- Would publish: \`${DEST}\`"
          else
            echo "- Published: \`${DEST}\`"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - id: report
      name: "Hand Over Release Entry"
      uses: actions/upload-artifact@v4
      with:
        name: release-entry-macos-arm64
        path: ${{ runner.temp }}/release-entry.txt
        # A dry run writes no entry, so there is nothing to hand over.
        if-no-files-found: ignore
        retention-days: 1

  publish-manifest:
    needs: [resolve, publish-flatpak-repo, publish-windows, publish-macos]
    # Runs once every publish job has settled.  The manifest is the only record of what
    # was released before, so it is never rebuilt by listing the bucket: this job folds
    # what this run uploaded into the file that is already there.  It stands down when
    # a publish job actually failed, and is excused only when the conditional jobs were
    # skipped for lack of a matching artifact.
    if: ${{ always() && !cancelled() && needs.resolve.result == 'success' && needs.publish-flatpak-repo.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.publish-windows.result) && contains(fromJSON('["success","skipped"]'), needs.publish-macos.result) }}
    runs-on: ubuntu-24.04

    steps:
    - id: entries
      name: "Collect Release Entries"
      # Each publish job hands over what it uploaded as a one-line artifact.  Artifacts
      # rather than job outputs, because a matrix job does not keep outputs per leg:
      # the leg that finished last would overwrite the other one's entry.  A dry run
      # hands over nothing, so finding no artifact here is expected and not fatal.
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        pattern: release-entry-*
        path: ${{ runner.temp }}/release-entries

    - id: manifest
      name: "Update Release Manifest"
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: auto
        R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        R2_BUCKET: ${{ vars.R2_BUCKET }}
        ENTRY_DIR: ${{ runner.temp }}/release-entries
        MAX_VERSIONS: "10"
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        set -euo pipefail
        MANIFEST=release-manifest.json
        if [ -z "${R2_BUCKET}" ] || [ -z "${R2_ENDPOINT}" ]; then
          echo "::error::R2_BUCKET and R2_ENDPOINT must be configured to update the release manifest"
          exit 1
        fi
        for TOOL in aws python3; do
          if ! command -v "${TOOL}" >/dev/null 2>&1; then
            echo "::error::${TOOL} is required to update the release manifest but is not on this runner"
            exit 1
          fi
        done

        ENDPOINT=(--endpoint-url "${R2_ENDPOINT}")
        WORK=$(mktemp -d)
        PREVIOUS="${WORK}/previous-${MANIFEST}"
        ENTRIES="${WORK}/entries.txt"
        SUMMARY="${WORK}/summary.md"
        : > "${ENTRIES}"

        # One line per artifact this run uploaded.  An unmatched pattern leaves the
        # glob as it is, which is why the guard is needed.
        for FILE in "${ENTRY_DIR}"/*/release-entry.txt; do
          if [ ! -f "${FILE}" ]; then
            continue
          fi
          while IFS= read -r LINE; do
            if [ -n "${LINE}" ]; then
              printf '%s\n' "${LINE}" >> "${ENTRIES}"
              echo "Uploaded by this run: ${LINE}"
            fi
          done < "${FILE}"
        done
        if [ ! -s "${ENTRIES}" ]; then
          echo "This run uploaded no per-version artifact; the manifest keeps its history as is"
        fi

        # The history comes from the file itself.  A brand new bucket has no object
        # yet; anything else going wrong must stop the job, because publishing a
        # manifest without the existing history would erase it.
        if aws s3api get-object --bucket "${R2_BUCKET}" --key "${MANIFEST}" \
             "${PREVIOUS}" "${ENDPOINT[@]}" > /dev/null 2> "${WORK}/err"; then
          echo "Folding this run's versions into the existing ${MANIFEST}"
        elif grep -qE 'NoSuchKey|Not Found|404' "${WORK}/err"; then
          echo "No ${MANIFEST} in the bucket yet; this run creates it"
          rm -f "${PREVIOUS}"
        else
          echo "::error::Unable to read s3://${R2_BUCKET}/${MANIFEST}; refusing to replace it without its history:"
          sed 's/^/  /' "${WORK}/err"
          exit 1
        fi

        python3 - "${MAX_VERSIONS}" "${ENTRIES}" "${PREVIOUS}" "${MANIFEST}" "${SUMMARY}" <<'PY'
        import json
        import os
        import sys

        max_versions = int(sys.argv[1])
        entries_path, previous_path, manifest_path, summary_path = sys.argv[2:6]


        def fail(message):
            print("::error::" + message)
            sys.exit(1)


        def sort_key(version):
            # A version is YYYY.MMDD.HHMM.SS with every part an integer, so sorting the
            # strings would put 2026.1025.9.1 ahead of 2026.1025.132.1.
            parts = version.split(".")
            if all(part.isdigit() for part in parts):
                return (0, tuple(int(part) for part in parts), version)
            return (1, (), version)


        targets = {}


        def remember(platform, branch):
            key = (platform, branch)
            if key not in targets:
                targets[key] = {}
            return targets[key]


        # Whatever the published file lists stays listed.  It is the history, and it is
        # not rediscovered from the bucket, so a version stays put even after its
        # object is gone.
        if os.path.exists(previous_path):
            try:
                with open(previous_path, encoding="utf-8") as handle:
                    previous = json.load(handle)
                for release in previous["releases"]:
                    versions = remember(release["platform"], release["branch"])
                    for version in release["versions"]:
                        versions[str(version["version"])] = int(version["size"])
            except (OSError, ValueError, KeyError, TypeError) as error:
                fail("the existing %s does not parse as a release manifest (%s); repair "
                     "or delete it in the bucket, then rerun"
                     % (os.path.basename(manifest_path), error))

        published = []
        with open(entries_path, encoding="utf-8") as handle:
            for line in handle:
                fields = [field.strip() for field in line.rstrip("\r\n").split("|")]
                if (len(fields) != 4 or not fields[0] or not fields[1] or
                        not fields[2] or not fields[3].isdigit()):
                    fail("malformed release entry %r" % line.strip())
                platform, branch, version = fields[0], fields[1], fields[2]
                size = int(fields[3])
                remember(platform, branch)[version] = size
                published.append((platform, branch, version, size))

        releases = []
        dropped = 0
        # Ordered by platform and branch so the file never depends on the order the
        # artifacts happened to be downloaded in.
        for key in sorted(targets):
            versions = targets[key]
            newest = sorted(versions.items(), key=lambda item: sort_key(item[0]),
                            reverse=True)[:max_versions]
            dropped += len(versions) - len(newest)
            releases.append({"platform": key[0], "branch": key[1], "versions": newest})

        # Laid out by hand so the file reads the way a person would write it; the
        # result is parsed again below, and only the parsed form is published.
        if releases:
            lines = ['{', '  "releases": [']
            for index, release in enumerate(releases):
                lines.append("    {")
                lines.append('      "platform": %s,' % json.dumps(release["platform"]))
                lines.append('      "branch": %s,' % json.dumps(release["branch"]))
                lines.append('      "versions": [')
                for position, (version, size) in enumerate(release["versions"]):
                    comma = "," if position < len(release["versions"]) - 1 else ""
                    lines.append('        { "version": %s, "size": %d }%s'
                                 % (json.dumps(version), size, comma))
                lines.append("      ]")
                lines.append("    }" + ("," if index < len(releases) - 1 else ""))
            lines.append("  ]")
            lines.append("}")
            text = "\n".join(lines) + "\n"
        else:
            text = '{\n  "releases": []\n}\n'

        expected = [{"platform": release["platform"], "branch": release["branch"],
                     "versions": [{"version": version, "size": size}
                                  for version, size in release["versions"]]}
                    for release in releases]
        if json.loads(text)["releases"] != expected:
            fail("the manifest built for upload does not read back the same")

        with open(manifest_path, "w", encoding="utf-8", newline="\n") as handle:
            handle.write(text)

        with open(summary_path, "w", encoding="utf-8", newline="\n") as summary:
            if published:
                summary.write("| Uploaded by this run | Branch | Version | Bytes |\n")
                summary.write("| --- | --- | --- | --- |\n")
                for platform, branch, version, size in published:
                    summary.write("| %s | %s | %s | %d |\n"
                                  % (platform, branch, version, size))
                summary.write("\n")
            summary.write("| Platform | Branch | Versions | Newest |\n")
            summary.write("| --- | --- | --- | --- |\n")
            for release in releases:
                summary.write("| %s | %s | %d | %s |\n" % (
                    release["platform"], release["branch"], len(release["versions"]),
                    release["versions"][0][0]))
            if not releases:
                summary.write("| _none_ | | | |\n")

        print("Manifest lists %d target(s), newest %d version(s) of each"
              % (len(releases), max_versions))
        if dropped:
            print("Retention dropped %d older version(s)" % dropped)
        PY

        cat "${MANIFEST}"
        if [ "${DRY_RUN}" = "true" ]; then
          echo "Dry run: not uploading ${MANIFEST}"
          NOTE="> Dry run: not uploaded. This run contributes no versions, so this is the manifest as it already stands."
        else
          aws s3 cp "${MANIFEST}" "s3://${R2_BUCKET}/${MANIFEST}" \
            "${ENDPOINT[@]}" --only-show-errors \
            --content-type "application/json; charset=utf-8" \
            --cache-control "no-cache"
          # Read the object back: an upload that reported success but stored something
          # else would otherwise only surface on the client side.
          aws s3 cp "s3://${R2_BUCKET}/${MANIFEST}" - "${ENDPOINT[@]}" --only-show-errors \
            | cmp - "${MANIFEST}"
          echo "Published and verified s3://${R2_BUCKET}/${MANIFEST}"
          NOTE="Published and verified at \`s3://${R2_BUCKET}/${MANIFEST}\`."
        fi

        {
          echo "## Release manifest"
          echo ""
          echo "${NOTE}"
          echo ""
          cat "${SUMMARY}"
        } >> "$GITHUB_STEP_SUMMARY"
        rm -rf "${WORK}"
