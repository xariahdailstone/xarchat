# Builds a Flatpak bundle from the linux-exe-x64 artifact published by the
# 'develop push' workflow (that artifact is a self-contained single-file executable).
# The Flatpak itself is defined by host/linux/flatpak/net.xariah.xarchat.yml.

name: "build flatpak"

on:
  workflow_run:
    workflows: [ "develop push" ]
    types: [ completed ]
    branches: [ "develop", "master" ]
  workflow_dispatch:
    inputs:
      source_run_id:
        type: string
        description: "develop push run ID to take linux-exe-x64 from (blank = latest successful develop run)"

permissions:
  actions: read
  contents: read

env:
  SOURCE_ARTIFACT: linux-exe-x64
  FLATPAK_RUNTIME_VERSION: "48"

jobs:
  build-flatpak-x64:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04

    steps:
    - id: checkout
      name: "Checkout Current Repository"
      uses: actions/checkout@v4

    - id: source_run
      name: "Resolve Source Run"
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        INPUT_RUN_ID: ${{ inputs.source_run_id }}
      run: |
        set -euo pipefail
        if [ -n "${INPUT_RUN_ID}" ]; then
          RUN_ID="${INPUT_RUN_ID}"
        elif [ "${{ github.event_name }}" = "workflow_run" ]; then
          RUN_ID="${{ github.event.workflow_run.id }}"
        else
          RUN_ID=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow develop-push.yml --branch develop --status success --limit 1 --json databaseId --jq '.[0].databaseId')
        fi
        if [ -z "${RUN_ID}" ] || [ "${RUN_ID}" = "null" ]; then
          echo "::error::Unable to determine the source workflow run"
          exit 1
        fi
        CREATED_AT=$(gh run view "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json createdAt --jq '.createdAt')
        TIMESTAMP=$(date -u -d "${CREATED_AT}" +'%Y.%-m%d.%-H%M.%-S')
        echo "Using run ${RUN_ID} (${CREATED_AT}) => ${TIMESTAMP}"
        echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
        echo "timestamp=${TIMESTAMP}" >> "$GITHUB_OUTPUT"

    - id: download_exe
      name: "Download linux-exe-x64 Artifact"
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.SOURCE_ARTIFACT }}
        path: flatpak-input
        run-id: ${{ steps.source_run.outputs.run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - id: stage_payload
      name: "Stage Flatpak Payload"
      shell: bash
      run: |
        set -euo pipefail
        BIN=$(find "${GITHUB_WORKSPACE}/flatpak-input" -type f -name xarchat -print -quit)
        if [ -z "${BIN}" ]; then
          echo "::error::Could not find the xarchat executable in the ${SOURCE_ARTIFACT} artifact"
          find "${GITHUB_WORKSPACE}/flatpak-input" -type f
          exit 1
        fi
        mkdir -p host/linux/flatpak/payload
        install -m755 "${BIN}" host/linux/flatpak/payload/xarchat
        ls -l host/linux/flatpak/payload

    - id: cache_flatpak_runtime
      name: "Cache Flatpak Runtime"
      uses: actions/cache@v4
      with:
        path: ~/.local/share/flatpak
        key: flatpak-runtime-gnome-${{ env.FLATPAK_RUNTIME_VERSION }}-v1

    - id: install_flatpak
      name: "Install Flatpak"
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
        flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        flatpak install --user --noninteractive "flathub" \
          "org.gnome.Platform//${{ env.FLATPAK_RUNTIME_VERSION }}" \
          "org.gnome.Sdk//${{ env.FLATPAK_RUNTIME_VERSION }}"

    - id: build_flatpak
      name: "Build Flatpak"
      shell: bash
      run: |
        set -euo pipefail
        flatpak-builder \
          --disable-rofiles-fuse \
          --force-clean \
          --repo="${GITHUB_WORKSPACE}/flatpak-repo" \
          "${GITHUB_WORKSPACE}/flatpak-build" \
          "${GITHUB_WORKSPACE}/host/linux/flatpak/net.xariah.xarchat.yml"

    - id: create_bundle
      name: "Create Flatpak Bundle"
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p flatpak-out
        BUNDLE="xarchat_${{ steps.source_run.outputs.timestamp }}_x64.flatpak"
        flatpak build-bundle \
          --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
          flatpak-repo "flatpak-out/${BUNDLE}" net.xariah.xarchat
        ls -l flatpak-out

    - id: publish_artifact_flatpak
      name: "Publish Flatpak Artifact"
      uses: actions/upload-artifact@v4
      with:
        name: linux-flatpak-x64
        path: ${{ github.workspace }}/flatpak-out/*.flatpak
        retention-days: 30

    - id: dump_logs
      name: "Dump Flatpak Build Log"
      if: failure()
      shell: bash
      run: |
        find flatpak-build -name "*.log" -o -name "*.txt" | head -n 50
        find flatpak-build -name "*.log" -exec sh -c 'echo "=== $1 ==="; tail -n 200 "$1"' _ {} \;