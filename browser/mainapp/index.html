<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>XarChat Main Interface</title>
        <link rel="stylesheet" type="text/css" href="styles/fonts.css" />
        <script>
            (function() {
                const u = new URLSearchParams(document.location.search);
                if (u.get("ClientPlatform") == "linux-x64") {
                    document.write('<link rel="stylesheet" type="text/css" href="assets-emoji/ui/fonts/noto-color-emoji/index.css" id="elEmojiFont" />');
                }
                else {
                    document.write('<!-- skipped emoji font css -->');
                }
            })();
        </script>
        <link rel="stylesheet" type="text/css" href="styles/dark-theme.css" id="elLinkDarkTheme" />
        <style>
            html, body {
                border: 0;
                padding: 0;
                margin: 0;
                width: 100%;
                height: 100%;
                /*overflow-x: clip;
                overflow-y: clip;*/
                scrollbar-width: none;
            }
            body {
                background: var(--bg-level-4);
                color: var(--fg-level-4);
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
            }
            .ss {
            }

            /*
            .titlebar {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: var(--titlebar-height);
            }
            .main {
                position: absolute;
                top: var(--titlebar-height);
                left: 0;
                width: 100%;
                height: calc(100vh - var(--titlebar-height));
                overflow: hidden;
            }
            .leftbar {
                height: 100%;
                max-height: 100vh;
                overflow: hidden;
            }
            .stage {
                height: 100%;
                max-height: 100vh;
                overflow: hidden;
            }
            */

            #elMain {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                --main-interface-width: 100vw;
            }

            * { 
                box-sizing: border-box; 
                -webkit-user-select: none;
                user-select: none;
            }

            #elTest {
                position: absolute;
                top: 10;
                left: 10;
                background-color: white;
                color: black;
                z-index: 999;
            }

            body:not(.loaded) { visibility: hidden; background: transparent; }
        </style>
    </head>
    <body>

        <script type="module">
            function onReady(func) {
                if (/complete|interactive|loaded/.test(document.readyState)) {
                    func();
                }
                else {
                    document.addEventListener("DOMContentLoaded", () => func());
                }
            }

            onReady(async () => {
                await import("./build/_polyfill.js");
                await import("./build/all-components.js");
                await import("./build/main.js");
            });

            // function shouldProactivelyLoad(moduleName) {
            //     return moduleName.startsWith("components/") ||
            //         (moduleName.indexOf("/debugtools/") != -1);
            // }
        </script>

    </body>
</html>
